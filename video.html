<!DOCTYPE html>
<html>
<head>
    <title>Video</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        body {
            text-align: center;
            padding: 30px;
        }
        .video-wrapper {
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2a1a55;
            box-shadow: 0 0 40px #7b2fff44, 0 0 80px #1a6fff22;
            margin-top: 20px;
        }
        .video-wrapper iframe {
            display: block;
        }
    </style>
</head>
<body>

<h1>▶ Video de YouTube</h1>

<div class="video-wrapper">
    <iframe
        width="800"
        height="450"
        src="https://www.youtube.com/embed/videoseries?list=PL063sw0wLFEtLqcw2W7BrRZXae0HpM8dG"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>
</div>

<p style="color:#8877aa; margin-top:16px; font-size:0.9rem;">
    Si el video no carga, asegúrate de tener conexión a internet.
</p>

</body>
</html>
