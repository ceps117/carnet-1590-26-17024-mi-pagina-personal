<!DOCTYPE html>
<html>
<head>
    <title>Bienvenida</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px;
        }
        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.7; transform: scale(1.05); }
        }
        .subtitle {
            font-size: 1.1rem;
            color: #8877aa;
            margin-top: 10px;
        }
        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, #7b2fff, #1a6fff);
            margin: 20px auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="welcome-icon">⬡</div>
<h1>Bienvenido al Sitio de Cristopher</h1>
<div class="divider"></div>
<p class="subtitle">Selecciona una opción del menú para comenzar.</p>

</body>
</html>
